<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Workshop Hub · Co-Thinking with AI, Batch 02">
<title>Workshop Hub · Co-Thinking with AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700;800;900&family=Poppins:wght@300;400;500;600;700&family=Work+Sans:wght@400;500;600&family=Sarabun:wght@400;500;600&family=Prompt:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#FFFCF3; --paper:#FFFFFF; --ink:#2B2B2B; --ink-soft:#6E6A62; --line:#EFE8D6;
  --red:#DD0035; --red-ink:#FFFFFF; --lime:#D8F45E; --lime-ink:#2B2B2B; --peri:#AAB6FA; --cyan:#7FF0F2;
  --prompt-bg:#F2F4FF; --prompt-line:#DDE2FF; --tag-a:#E6EAFF; --tag-b:#DBFBFB; --tag-c:#F1FBC9; --note:#F4FBD3;
  --muted-card:#F8F4E8;
  --warn:#FFF1DC; --warn-line:#F3D29E; --ok:#1E8A4C; --bad:#C2410C;
  --tea:#E07A2E; --leaf:#1F4D3A; --leaf-soft:#1F4D3A; --cream:#FFF6E9;
  --edge:#D6CCB4; --edge-read:#5E7A00; --edge-write:#0E8A8C;
  --font:"Poppins","Prompt",system-ui,sans-serif;
  --display:"League Spartan","Poppins","Prompt",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#1C1A20; --paper:#26232B; --ink:#F5F1E6; --ink-soft:#B5AFA3; --line:#3A3640;
    --red:#FF4D6F; --red-ink:#1C1A20; --prompt-bg:#2F2C3D; --prompt-line:#3F3B52;
    --tag-a:#34385C; --tag-b:#1F4445; --tag-c:#3F4720; --note:#33391C; --muted-card:#221F27;
    --warn:#3A2E1C; --warn-line:#6B5226; --ok:#5FD08E; --bad:#FB923C; --cream:#3A3226; --leaf-soft:#9FD4B6;
    --edge:#4A4552; --edge-read:#C5E35A; --edge-write:#5FE3E5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#1C1A20; --paper:#26232B; --ink:#F5F1E6; --ink-soft:#B5AFA3; --line:#3A3640;
  --red:#FF4D6F; --red-ink:#1C1A20; --prompt-bg:#2F2C3D; --prompt-line:#3F3B52;
  --tag-a:#34385C; --tag-b:#1F4445; --tag-c:#3F4720; --note:#33391C; --muted-card:#221F27;
    --warn:#3A2E1C; --warn-line:#6B5226; --ok:#5FD08E; --bad:#FB923C; --cream:#3A3226; --leaf-soft:#9FD4B6;
    --edge:#4A4552; --edge-read:#C5E35A; --edge-write:#5FE3E5;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--peri);outline-offset:2px;border-radius:6px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:900;color:var(--red);letter-spacing:.01em;text-decoration:none;font-size:18px;line-height:1}
.brand small{display:block;font-family:var(--font);font-weight:600;color:var(--ink);font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.lang{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft)}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:999px;cursor:pointer;font-weight:500;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--red);color:var(--red-ink)}

.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 120px}
.pill{display:inline-block;background:var(--lime);color:var(--lime-ink);font-weight:600;font-size:14px;padding:5px 16px;border-radius:999px;margin-bottom:14px}
h1{font-family:var(--display);font-weight:900;margin:0;color:var(--red);font-size:clamp(40px,7.5vw,80px);line-height:.92;letter-spacing:-.02em;text-transform:uppercase;text-wrap:balance}
h1 .th{display:block;font-family:"Prompt",var(--font);text-transform:none;letter-spacing:0;font-weight:600;color:var(--ink);font-size:clamp(20px,2.8vw,28px);line-height:1.35;margin-top:14px}
.lede{font-size:17.5px;color:var(--ink-soft);max-width:62ch;margin:16px 0 0}
h2{font-size:24px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em;line-height:1.3;text-wrap:balance}
.h2-sub{margin:0 0 18px;color:var(--ink-soft);font-size:15px;max-width:70ch}
section{margin-top:56px;padding-top:40px;border-top:1px solid var(--line)}
h1.sm{font-size:clamp(34px,5.4vw,60px);line-height:.95}
.crumb{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-soft);text-decoration:none;margin-bottom:22px;font-weight:500}
.crumb:hover{color:var(--red)}

/* hub */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.ex{display:flex;flex-direction:column;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;text-decoration:none;transition:border-color .15s,box-shadow .15s,transform .15s}
a.ex{border:1.5px solid color-mix(in srgb,var(--red) 30%,var(--line));box-shadow:0 4px 14px -10px rgba(0,0,0,.35)}
.go{align-self:flex-start;margin-top:4px;background:var(--red);color:var(--red-ink);font-weight:600;font-size:13.5px;padding:6px 16px;border-radius:999px}
a.ex:hover .go{filter:brightness(1.08)}
a.ex:hover{transform:translateY(-2px);border-color:var(--red);box-shadow:0 6px 20px -12px color-mix(in srgb,var(--red) 60%,transparent)}
.ex.soon{background:var(--muted-card)}
.ex-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex-code{font-family:var(--display);font-weight:900;font-size:34px;line-height:1;color:var(--red)}
.ex.soon .ex-code{color:var(--ink-soft)}
.ex h3{margin:0;font-size:18px;font-weight:600;line-height:1.35}
.ex p{margin:0;font-size:14.5px;color:var(--ink-soft)}
.ex-foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.status.ready{background:var(--lime);color:var(--lime-ink)}
.status.soon{background:var(--line);color:var(--ink-soft)}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--tag-a);font-weight:500;white-space:nowrap}
.chip.b{background:var(--tag-b)} .chip.c{background:var(--tag-c)}


/* meta strip on exercise */
.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:28px;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.meta div{padding:14px 18px;border-right:1px solid var(--line)}
.meta div:last-child{border-right:0}
.meta dt{font-size:13px;color:var(--ink-soft);font-weight:500}
.meta dd{margin:2px 0 0;font-weight:600;font-size:15.5px;line-height:1.4}

/* workflow */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding-bottom:6px}
.node{flex:1 1 0;min-width:150px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px}
.node.io{background:var(--tag-b);border-color:transparent}
.node.out{background:var(--lime);border-color:transparent;color:var(--lime-ink)}
.node .k{font-size:13px;font-weight:600;color:var(--red)}
.node.io .k,.node.out .k{color:inherit;opacity:.75}
.node b{font-weight:600;font-size:15px;line-height:1.35}
.node span{font-size:13px;color:var(--ink-soft);line-height:1.45}
.node.out span{color:inherit;opacity:.8}
.arrow{flex:0 0 26px;display:grid;place-items:center;color:var(--red);font-weight:700}
.flow-note{margin:14px 0 0;font-size:14.5px;color:var(--ink-soft);max-width:78ch}

/* kit */
.kit{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.kit-col{display:grid;grid-template-columns:180px 1fr;border-bottom:1px solid var(--line)}
.kit-col:last-child{border-bottom:0}
.kit-col h3{margin:0;padding:18px 20px;font-size:15px;font-weight:600;background:var(--muted-card)}
.kit-col ul{list-style:none;margin:0;padding:0}
.kit-col li{display:grid;grid-template-columns:1fr auto;gap:6px 20px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.kit-col li:last-child{border-bottom:0}
.kit-col li b{font-weight:600;font-size:15.5px;line-height:1.4}
.kit-col li span{grid-column:1;font-size:14px;color:var(--ink-soft)}
.kit-col li .side{grid-column:2;grid-row:1 / span 2;justify-self:end}
.tag{display:inline-block;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--tag-c);white-space:nowrap}
.tag.need{background:var(--red);color:var(--red-ink)}
.tag.opt{background:var(--line);color:var(--ink-soft)}
.dl{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:var(--red);color:var(--red-ink);text-decoration:none;font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px}
.dl.off{background:var(--line);color:var(--ink-soft);cursor:not-allowed}
@media (max-width:820px){ .kit-col{grid-template-columns:1fr} .kit-col h3{padding:12px 20px} }
@media (max-width:520px){ .kit-col li{grid-template-columns:1fr} .kit-col li .side{grid-column:1;grid-row:auto;justify-self:start} }
.none{font-size:14px;color:var(--ink-soft);margin:0}

/* steps */
.steps{display:flex;flex-direction:column;gap:16px;counter-reset:s}
.step{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:22px;display:grid;grid-template-columns:52px 1fr;gap:4px 16px}
.num{width:44px;height:44px;border-radius:50%;background:var(--red);color:var(--red-ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:22px;padding-top:3px}
.step.setup .num{background:var(--peri);color:#1C1A20}
.step-body{min-width:0}
.step-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.step h3{margin:6px 0 2px;font-size:19px;font-weight:600;line-height:1.35}
.step .why{margin:0;color:var(--ink-soft);font-size:15px;max-width:70ch}
.todo{margin:12px 0 0;padding-left:20px;font-size:15px}
.step-title{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.step-title h3{margin-top:0}
.wb-row{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap}
.wb-arrow{color:var(--ink-soft);font-size:13px}
.wb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 10px 3px 8px;border-radius:999px;white-space:nowrap;line-height:1.4}
.wb svg{width:14px;height:14px;flex:0 0 auto}
.wb-pc{background:var(--tag-b);color:var(--ink)}
.wb-ai{background:var(--tag-a);color:var(--ink)}
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px;color:var(--ink-soft);margin:-6px 0 14px}
.todo-groups{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.todo-group{border-radius:12px;padding:12px 16px 14px;border:1px solid var(--line)}
.tg-pc{background:color-mix(in srgb,var(--tag-b) 35%,var(--paper))}
.tg-ai{background:color-mix(in srgb,var(--tag-a) 45%,var(--paper))}
.todo-group .todo{margin-top:8px}
@media (max-width:720px){ .todo-groups{grid-template-columns:1fr} }
.todo li{margin:4px 0}
.prompt{margin-top:14px;background:var(--prompt-bg);border:1px solid var(--prompt-line);border-radius:12px;overflow:hidden}
.prompt-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px 8px 14px;border-bottom:1px solid var(--prompt-line);font-size:12.5px;color:var(--ink-soft);font-weight:500}
.copy{border:0;background:var(--red);color:var(--red-ink);font-weight:600;font-size:13px;padding:6px 14px;border-radius:999px;cursor:pointer;min-width:84px}
.copy.ok{background:var(--lime);color:var(--lime-ink)}
.prompt pre{margin:0;padding:14px 16px 16px;white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:14.5px;line-height:1.7;font-weight:400}
.prompt pre[lang="th"]{font-family:"Prompt",var(--font);font-weight:300}
.expect{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.expect div{border-radius:12px;padding:10px 14px;font-size:14px}
.expect .see{background:var(--tag-b)}
.expect .tip{background:var(--note)}
.expect b{display:block;font-size:13px;font-weight:600;margin-bottom:2px}

/* learn */
.learn{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.learn-box{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px 22px}
.learn-box.use{background:var(--tag-a);color:var(--ink);border-color:transparent}
.learn-box h3{margin:0 0 10px;font-size:13px;font-weight:600;opacity:.8}
.learn-box ol,.learn-box ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.learn-box li b{font-weight:600}
.corner{margin-top:16px;display:flex;gap:14px;align-items:center;background:var(--note);border-radius:16px;padding:14px 18px;font-size:14.5px}
.mini22{flex:0 0 auto;display:grid;grid-template-columns:repeat(2,18px);gap:3px}
.mini22 i{width:18px;height:18px;border-radius:4px;background:var(--line)}
.mini22 i.on{background:var(--red)}

/* exercise (drill) pages */
.ex.drill .ex-code{font-size:28px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.howto div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:14.5px}
.howto b{display:block;font-weight:600;font-size:15.5px;margin-bottom:2px}
.howto .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:var(--red-ink);font-weight:600;font-size:13px;margin-right:6px;vertical-align:1px}
.pair{display:grid;grid-template-columns:1fr 2.4fr;gap:14px;align-items:start}
.pair .prompt{margin-top:0;border:2px solid var(--red);background:var(--paper)}
.pair .prompt-bar{border-bottom-color:var(--line)}
.pair h3{margin:0;font-size:18px;font-weight:600;color:var(--ink)}
.pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.pbody.plain{font-size:15px;line-height:1.7;font-weight:400;padding:16px}
.seg-part{position:relative;border-radius:10px;padding:8px 12px;white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.7;font-weight:400}
.seg-part .lbl{display:none;font-size:13px;font-weight:600;margin-bottom:2px;opacity:.75}
.show .seg-part{background:var(--hl)}
.show .seg-part .lbl{display:block}
.t-who{--hl:var(--tag-a)} .t-why{--hl:var(--note)} .t-ctx{--hl:var(--tag-b)}
.t-out{--hl:var(--prompt-bg)} .t-rule{--hl:var(--tag-c)} .t-fall{--hl:var(--muted-card)}
.xray{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;cursor:pointer}
.xray input{accent-color:var(--red);width:16px;height:16px;margin:0}
.cmp-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px;min-width:520px}
.cmp th,.cmp td{padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.cmp tr:last-child td{border-bottom:0}
.cmp th{font-size:13px;color:var(--ink-soft);font-weight:600}
.cmp td.c,.cmp th.c{text-align:center;width:120px}
.cmp input{accent-color:var(--red);width:18px;height:18px}
.cmp small{display:block;color:var(--ink-soft);font-size:13px}
.cmp tfoot td{font-weight:600;background:var(--muted-card)}

/* cheatsheet */
.bundle{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:8px 8px 8px 18px;font-size:14px;color:var(--ink-soft);margin-bottom:8px}
.copy:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed}
#bundleText{margin:0 0 8px;background:var(--prompt-bg);border:1px solid var(--prompt-line);border-radius:12px;padding:12px 14px;white-space:pre-wrap;font-family:var(--font);font-size:13.5px}
.cs-group{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px}
.cs-group h3{margin:0;font-size:18px;font-weight:600}
.cs-group span{font-size:14px;color:var(--ink-soft)}
.cs{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cs-row{display:grid;grid-template-columns:200px 1fr 1.5fr;gap:16px;padding:16px 18px;border-bottom:1px solid var(--line);align-items:start}
.cs-row:last-child{border-bottom:0}
.cs-row.on{background:var(--note)}
.cs-pick{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.cs-pick input{accent-color:var(--red);width:18px;height:18px;margin:3px 0 0}
.cs-pick b{display:block;font-weight:600;font-size:16px;line-height:1.3}
.cs-pick small{display:block;font-size:13.5px;color:var(--ink-soft)}
.cs-why{font-size:14px;color:var(--ink-soft);display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.cs-cmd{background:var(--prompt-bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.cs-cmd p{margin:0;font-size:14px;line-height:1.6;font-weight:400;align-self:stretch}
@media (max-width:820px){ .cs-row{grid-template-columns:1fr;gap:10px} .bundle{border-radius:16px} }

.foot{margin-top:64px;font-size:13px;color:var(--ink-soft);border-top:1px solid var(--line);padding-top:16px}

@media (max-width:820px){
  .meta{grid-template-columns:1fr}
  .meta div{border-right:0;border-bottom:1px solid var(--line)}
  .meta div:last-child{border-bottom:0}
  .learn,.pair,.howto{grid-template-columns:1fr}
}
@media (max-width:640px){
  .flow{flex-direction:column;overflow:visible}
  .node{min-width:0}
  .arrow{flex-basis:22px;transform:rotate(90deg)}
  .step{grid-template-columns:1fr;padding:18px}
  .num{width:38px;height:38px;font-size:19px}
  .wrap{padding-top:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- revamp: tiers, setup, case page, step reveal ---- */
section.tier-lines{background:var(--muted-card);border:1px solid var(--line);border-radius:20px;padding:28px 24px 24px}
.tag.demo{background:var(--tag-a);color:var(--ink)}
.tag.demo-pill{background:var(--red);color:var(--red-ink)}
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:start}
.setup-list{list-style:none;margin:0;padding:6px 18px;background:var(--paper);border:1px solid var(--line);border-radius:16px}
.setup-list li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px;color:var(--ink-soft)}
.setup-list li:last-child{border-bottom:0}
.setup-list b{display:block;color:var(--ink);font-weight:600;font-size:15.5px}
.skillpack{background:var(--note);border-radius:16px;padding:20px}
.skillpack.inst{margin-top:14px}
.skillpack h3{margin:0 0 8px;font-size:18px;font-weight:600}
.skills{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-soft)}
.skills .chip{background:var(--tag-a);color:var(--ink);font-family:var(--mono);font-size:12.5px;margin-right:4px}
.sp-h{margin:16px 0 4px;font-size:13px;font-weight:600;color:var(--ink-soft)}

/* ---- review round B: downloads, labels, tactile states ---- */

.copy,.reveal-btn,.dl,.go,.seg button{transition:transform .12s}
.copy:active,.reveal-btn:active,.dl:not(.off):active,.seg button:active{transform:translateY(1px) scale(.98)}

.go{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 18px}

a.ex:hover .go svg{transform:translateX(3px)}

.copy{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.copy::before{content:"";width:14px;height:14px;background:currentColor;flex:0 0 auto;-webkit-mask:var(--ic-copy) center/contain no-repeat;mask:var(--ic-copy) center/contain no-repeat}
.copy.ok::before{-webkit-mask-image:var(--ic-check);mask-image:var(--ic-check)}
:root{--ic-copy:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='5.5' y='5.5' width='8' height='8' rx='1.6' fill='none' stroke='black' stroke-width='1.7'/><path d='M3.5 10.5h-.4A1.6 1.6 0 0 1 1.5 8.9V3.1A1.6 1.6 0 0 1 3.1 1.5h5.8a1.6 1.6 0 0 1 1.6 1.6v.4' fill='none' stroke='black' stroke-width='1.7'/></svg>");--ic-check:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><path d='M3 8.5l3.2 3.2L13 4.5' fill='none' stroke='black' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>")}

.reveal-btn,.dd{border:1.5px solid color-mix(in srgb,var(--ink) 40%,var(--line));background:var(--paper)}
.reveal-btn:hover{background:var(--muted-card);border-color:var(--ink)}
.reveal-btn{padding:8px 12px 8px 20px;gap:14px}
.rb-ch,.dd-c{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink-soft);flex:0 0 auto}

.dd-c{margin-left:auto}

.stepbar{position:sticky;top:var(--topH,56px);z-index:4;display:flex;gap:6px;overflow-x:auto;padding:8px 0;margin:18px 0 0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);scrollbar-width:none}

.stepbar button{position:relative;flex:0 0 auto;min-width:44px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:14px;cursor:pointer}

/* ---- workflow ---- */
.wf{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:20px 30px}

.wf>li.end::after{display:none}

.wf-tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}

.wf-go .chev{width:14px;height:14px}
button.wf-n:hover .wf-go{color:var(--ink)}
.wf-key{list-style:none;margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;font-size:13.5px;color:var(--ink-soft)}

/* gradients: same hues as the brand tokens, slightly shifted */
:root{--g-red:linear-gradient(135deg,#DD0035,#E21E4D);--g-lime:linear-gradient(135deg,#D8F45E,#8FEFD0);--g-peri:linear-gradient(135deg,#AAB6FA,#7FF0F2)}

.copy:not(:disabled):active,.dl:not(.off):active{transform:translateY(0);box-shadow:none}
.copy:focus-visible,.dl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.copy,.dl{transition:none!important;transform:none!important}}
/* ===== round 2: neutral base, role + tier gradients, dark prompt box ===== */
:root{
  --bg:#FFFCF3; --paper:#FFFFFF; --ink:#111111; --ink-soft:#5C5C5C; --line:#E5E5E5;

  --bg:#121212; --paper:#1C1C1C; --ink:#F5F5F5; --ink-soft:#B0B0B0; --line:#333333;
  --muted-card:#1A1A1A; --cream:#262626; --edge:#4A4A4A;
  --code-bg:#0B0B0B; --code-line:#3A3A3A;
  --g-peri:linear-gradient(135deg,#8E9BF0,#4FD3D6);
  --g-lime:linear-gradient(135deg,#C4E04A,#6FD8B8);
  --g-grid:linear-gradient(135deg,#FF4D6F,#F06CB0); --on-grid:#1C1A20;
  --g-dots:linear-gradient(135deg,#8E9BF0,#4FD3D6);
  --g-lines:linear-gradient(135deg,#C4E04A,#6FD8B8);
}}
:root[data-theme="dark"]{
  --bg:#121212; --paper:#1C1C1C; --ink:#F5F5F5; --ink-soft:#B0B0B0; --line:#333333;
  --muted-card:#1A1A1A; --cream:#262626; --edge:#4A4A4A;
  --code-bg:#0B0B0B; --code-line:#3A3A3A;
  --g-peri:linear-gradient(135deg,#8E9BF0,#4FD3D6);
  --g-lime:linear-gradient(135deg,#C4E04A,#6FD8B8);
  --g-grid:linear-gradient(135deg,#FF4D6F,#F06CB0); --on-grid:#1C1A20;
  --g-dots:linear-gradient(135deg,#8E9BF0,#4FD3D6);
  --g-lines:linear-gradient(135deg,#C4E04A,#6FD8B8);
}
/* prompt boxes: white (dark grey in dark mode), black text, crimson accents */
.prompt,.install,#bundleText,.cs-cmd{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.prompt{border-top:3px solid var(--red)}
.prompt-bar,.install-bar{border-bottom-color:var(--line);color:var(--ink-soft)}
.prompt pre,.prompt pre[lang="th"]{color:var(--ink);font-weight:400}
.prompt .xray{color:var(--ink)}
.show .seg-part{background:var(--paper);border:1px solid var(--line);color:var(--ink)}
.show .seg-part .lbl{color:var(--red);opacity:1}
.install code,.cs-cmd code,.install pre{color:var(--ink)}
/* ux trim: plain card arrow, prompt typeface */
.ex .go{background:none;color:var(--ink-soft);padding:0;min-height:0;align-self:flex-end;margin-top:2px}
.ex .go svg{width:22px;height:22px}
a.ex:hover .go{color:var(--red);filter:none}
.prompt pre,.prompt pre[lang="th"],.show .seg-part,.pbody,#bundleText{font-family:"Work Sans","Sarabun",var(--font);font-size:15.5px;line-height:1.7}
/* workflow summary strip + card numbers */
.wf-sum{list-style:none;margin:0 0 22px;padding:0 0 4px;display:flex;align-items:stretch;gap:0;overflow-x:auto;scrollbar-width:thin}
.wf-sum>li{position:relative;display:flex;flex:1 1 0;min-width:150px;padding-right:22px}
.wf-sum>li:last-child{padding-right:0}
.wf-sum>li:not(:last-child)::after{content:"";position:absolute;right:6px;top:50%;width:9px;height:9px;border-top:2px solid var(--red);border-right:2px solid var(--red);transform:translateY(-50%) rotate(45deg)}
.wfs{display:flex;flex-direction:column;align-items:flex-start;gap:6px;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--muted-card);cursor:pointer;font:inherit;color:var(--ink);transition:border-color .15s}
.wfs:hover{border-color:var(--ink)}
.wfs-n{font-family:var(--display);font-weight:900;font-size:20px;line-height:1;color:var(--ink)}
.wfs-l{font-weight:600;font-size:15px;line-height:1.35}
.wfs-dots{display:flex;gap:5px;margin-top:auto}
.wfs-d{width:10px;height:10px;border-radius:50%;display:block}
.wfs-d.you{border:2px solid var(--ink);background:var(--paper)}
.wfs-d.claude{background:var(--red)}
.wfs-d.tool{background:var(--g-peri)}
.wfs-d.script{background:#141414}
.wf-no{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;margin-right:2px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:700;line-height:1}
.wf-n.script .wf-no{background:#F5F5F5;color:#141414}
@media (max-width:640px){.wf-sum>li{min-width:170px}}
.wf>li{scroll-margin-top:calc(var(--topH,56px) + 64px)}
/* workflow roles */
.wf-n{border-width:1.5px}
.wf-n.you{border-color:var(--ink);background:var(--paper)}
.wf-n.claude{background:var(--paper);border-color:var(--red);color:var(--ink)}
.wf-n.tool{background:var(--g-peri);border-color:transparent;color:#111}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wf-n.script{border-color:#3A3A3A}}
.wf-n.tool .wf-who,.wf-n.tool .wf-t,.wf-n.tool .wf-x,.wf-n.tool .wf-go,
.wf-n.script .wf-who,.wf-n.script .wf-t,.wf-n.script .wf-x,.wf-n.script .wf-go{color:inherit}
.wf-n.tool .wf-x,.wf-n.script .wf-x{opacity:.9}
button.wf-n.claude:hover{background:var(--muted-card);border-color:var(--red)}
button.wf-n.tool:hover{background:var(--g-peri);filter:brightness(1.05);border-color:transparent}
button.wf-n.script:hover{background:#141414;filter:brightness(1.4);border-color:#141414}
.wf>li::after{border-color:var(--red)}
/* step numbers, step bar */
.num{background-image:var(--g-red)}
.stepbar button.on{background:var(--g-red);border-color:transparent;color:var(--red-ink)}
body[data-tier="dots"] .stepbar button.on{background:var(--g-dots);color:var(--on-dots)}
body[data-tier="grid"] .stepbar button.on{background:var(--g-grid);color:var(--on-grid)}
body[data-tier="lines"] .stepbar button.on{background:var(--g-lines);color:var(--on-lines)}
/* tier bands (home) */
.tier-band{padding:18px 22px;border:0;border-radius:20px}
.tier-dots .tier-band{background:var(--g-dots);color:var(--on-dots)}
.tier-grid .tier-band{background:var(--g-grid);color:var(--on-grid)}
.tier-lines .tier-band{background:var(--g-lines);color:var(--on-lines)}
.tier-band .tier-eyebrow,.tier-band .h2-sub,.tier-band .tier-meta,.tier-band .tier-meta b{color:inherit}
.tier-band .h2-sub,.tier-band .tier-meta span{opacity:.85}
.tier-band .tag.opt{background:rgba(255,255,255,.55);color:#111;border-color:transparent}
.tier-band .tier-icon{background:var(--paper);border-color:transparent}
section.tier-lines{background:transparent;border:0;padding:0}
/* case-page hero */
.case-hero{border-radius:22px;padding:24px 26px 22px;margin-bottom:6px}
.case-hero.tier-dots{background:var(--g-dots);color:var(--on-dots)}
.case-hero.tier-grid{background:var(--g-grid);color:var(--on-grid)}
.case-hero.tier-lines{background:var(--g-lines);color:var(--on-lines)}
.case-hero .crumb,.case-hero .case-code,.case-hero h1,.case-hero h1 .th,.case-hero .lede{color:inherit}
.case-hero .crumb:hover{opacity:.7}
.case-hero h1 .th,.case-hero .lede{opacity:.88}
.case-hero .tag.demo{background:rgba(255,255,255,.6);color:#111}
.case-hero .lede{margin-bottom:0}
/* home cards: gradient border on hover */
.ex:hover{border-color:transparent;background:linear-gradient(var(--paper),var(--paper)) padding-box,var(--g-red) border-box}
/* collapsed Setup */
.setup .sp-top{margin:6px 0 14px}
@media (prefers-reduced-motion:reduce){.wf-n,.ex{transition:none!important}}
/* ---- motion layer: transform/opacity only; prompts, reading text and the Case 3 diagram stay static ---- */
@keyframes mo-in{from{opacity:0;transform:translateY(12px)}}
@keyframes mo-pop{0%{transform:scale(.92);opacity:.4}60%{transform:scale(1.04)}100%{transform:none}}
@keyframes mo-bump{50%{transform:scale(1.06)}}
.rv{opacity:0}
.rv.in{opacity:1;animation:mo-in .36s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:var(--d,0ms)}
#app > .pill.rv.in,#app > h1.rv.in,#app > .lede.rv.in{animation-duration:.5s}
.rv.in .chip{animation:mo-pop .3s ease-out backwards;animation-delay:calc(var(--d,0ms) + 160ms)}
.rv.in .chip:nth-child(2){animation-delay:calc(var(--d,0ms) + 200ms)}
.rv.in .chip:nth-child(3){animation-delay:calc(var(--d,0ms) + 240ms)}
.copy:not(:disabled):active,.dl:not(.off):active{transform:scale(.97);transition-duration:.1s}
.ex:active{transform:scale(.985)}
.copy.ok{animation:mo-bump .22s ease-out}
@media (prefers-reduced-motion:reduce){.rv{opacity:1!important}.rv.in,.rv.in .chip,.copy.ok{animation:none!important}.copy:active,.dl:active,.ex:active{transform:none!important}}
/* ===== 2026-10-13: side menu, glitter buttons, learn side by side, workflow timeline ===== */
.top-l{display:flex;align-items:center;gap:12px}
.side-btn{display:none;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1.5px solid color-mix(in srgb,var(--ink) 40%,var(--line));border-radius:999px;background:var(--paper);font:inherit;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.side{font-size:14px}
.side nav{display:flex;flex-direction:column}
.side a,.side button{display:block;width:100%;min-height:40px;text-align:left;border:0;background:none;font:inherit;color:var(--ink);text-decoration:none;padding:8px 12px;border-radius:10px;cursor:pointer;line-height:1.35}
.side a:hover,.side button:hover{background:var(--muted-card)}
.side a[aria-current="page"]{background:var(--ink);color:var(--bg);font-weight:600}
.side a:focus-visible,.side button:focus-visible,.side-btn:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.sd-code{display:block;font-size:11.5px;font-weight:600;letter-spacing:.04em;opacity:.7}
.sd-tier{display:flex;align-items:center;gap:8px;margin:20px 12px 4px;font-family:var(--display);font-weight:800;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.sd-tier::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--g-dots)}
.sd-tier.tier-grid::before{background:var(--g-grid)}

.sd-list,.sd-sub{list-style:none;margin:0;padding:0}
.sd-sub{margin:4px 0 8px 14px;padding-left:8px;border-left:2px solid var(--line)}
.sd-sub button{min-height:36px;padding:6px 10px;font-size:13.5px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sd-sub button.on{color:var(--ink);font-weight:600;background:var(--muted-card);box-shadow:inset 3px 0 0 var(--red)}
@media (min-width:1100px){
  .shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:40px;max-width:1380px;margin:0 auto;padding:0 20px}
  .shell>.wrap{width:100%;max-width:1080px;margin:0;padding-left:0;padding-right:0}
  .top-in{max-width:1380px}
  .side{position:sticky;top:var(--topH,56px);align-self:start;max-height:calc(100vh - var(--topH,56px));overflow-y:auto;padding:28px 0 40px;scrollbar-width:thin}
  .stepbar{display:none}
}

  body.side-open .side{transform:none;visibility:visible;transition:transform .25s ease}

/* Glitter buttons, same family as the Grid & Dots website (shimmer + light sweep) */
@keyframes shimmer{from{background-position:130% 0}to{background-position:-130% 0}}
@keyframes sweep{0%,82%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.reveal-btn[aria-expanded="false"],.dl:not(.off){position:relative;overflow:hidden;isolation:isolate;color:#fff;border-color:transparent;
  background-image:linear-gradient(110deg,#DD0035 0%,#DD0035 40%,#F2557F 50%,#DD0035 60%,#DD0035 100%)!important;background-size:260% 100%;
  box-shadow:0 10px 24px -12px rgba(219,24,76,.7);animation:shimmer 2.4s linear 1 both}
.reveal-btn[aria-expanded="false"]::after,.dl:not(.off)::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:sweep 2.2s cubic-bezier(.22,1,.36,1) .6s 1 both}
.reveal-btn[aria-expanded="false"]:hover,.dl:not(.off):hover{border-color:transparent;animation:shimmer 1.8s linear infinite}
.reveal-btn[aria-expanded="false"]:hover::after,.dl:not(.off):hover::after{animation:sweep 1.8s cubic-bezier(.22,1,.36,1) infinite}
@media (prefers-reduced-motion:reduce){.reveal-btn,.dl{animation:none!important}.reveal-btn::after,.dl::after{display:none}}

/* What you take home + what you learn, side by side */
.learn-cols>div{display:flex;flex-direction:column;min-width:0}
.learn-cols .learn-box{flex:1}
.learn-cols h3{margin:0 0 10px;font-size:17px;font-weight:700}
.learn-box li .use{display:block;margin-top:4px;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}

/* Workflow timeline: phase headers, one row per job, details on tap */
.wft,.wft-list{list-style:none;margin:0;padding:0}
.wft{display:flex;flex-direction:column;gap:22px}
.wft-ph h3{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:17px;font-weight:700;line-height:1.3}
.wft-pn{display:inline-grid;place-items:center;flex:0 0 auto;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--g-red);color:var(--red-ink);font-family:var(--display);font-weight:900;font-size:15px;line-height:1}
body[data-tier="dots"] .wft-pn{background:var(--g-dots);color:var(--on-dots)}
body[data-tier="grid"] .wft-pn{background:var(--g-grid);color:var(--on-grid)}

.wft-list{display:flex;flex-direction:column;gap:8px;margin-left:14px;padding-left:26px;border-left:2px solid var(--line)}

.wft-row.claude{border-color:color-mix(in srgb,var(--red) 45%,var(--line))}

.wft-d{min-width:0}
.wft-d summary{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;min-height:44px;padding:10px 12px;list-style:none;cursor:pointer;border-radius:12px}

function wireSetup(root){
  const seg = root.querySelector(".os-pick .seg"); if (!seg) return;
  const set = os => {
    seg.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.os === os)));
    root.querySelectorAll("[data-os-panel]").forEach(p => { p.hidden = p.dataset.osPanel !== os; });
    try { localStorage.setItem("wh-os", os); } catch (e) {}
  };
  seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => set(b.dataset.os)));
  let os = null; try { os = localStorage.getItem("wh-os"); } catch (e) {}
  set(os || (/^Win/.test(navigator.platform || "") ? "win" : "mac"));
  root.querySelectorAll("button[data-dl]").forEach(b => b.addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([WAT_INSTRUCTION], { type: "text/markdown;charset=utf-8" }));
    a.download = "CLAUDE.md"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }));
}

/* ---------- lanes ---------- */
var LANES = [
  { id:'human', th:'คนตัดสินใจ', en:'Human' },
  { id:'ai',    th:'Claude',     en:'AI' },
  { id:'tool',  th:'เครื่องมือ',   en:'Tools' }
];
var MAIN = ['A','B'];

/* ---------- state ---------- */
var state = { flow:'A', step:0, file:null, more:false, lang:(opts&&opts.lang)||'th', fromB:false, showPrompt:false };

function flowById(id){ return FLOWS.filter(function(f){return f.id===id;})[0]; }
function flow(){ return flowById(state.flow); }
function cur(){ return flow().steps[state.step]; }
function visible(){ return FLOWS.filter(function(f){ return MAIN.indexOf(f.id)>-1 || state.more; }); }
function laneIdx(id){ for(var i=0;i<LANES.length;i++) if(LANES[i].id===id) return i; return 0; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function fileName(id){ return BRAIN.filter(function(b){return b.id===id;})[0].file; }
function toolName(id){ return TOOLS.filter(function(t){return t.id===id;})[0].name; }

var elBrain = root.getElementById('brain'), elTabs = root.getElementById('tabs'),
    elFhead = root.getElementById('fhead'), elSwim = root.getElementById('swim'),
    elDetail = root.getElementById('detail'), elBar = root.getElementById('stepbar'), elFpanel = root.getElementById('fpanel');

/* ---------- Brand Brain: one row of chips ---------- */
function renderBrain(){
  var s = cur();
  elBrain.innerHTML = '<span class="zone">Brand Brain · ไฟล์ 4 ไฟล์ที่เก็บไว้ใน Claude Project</span>'+
    BRAIN.map(function(b){
      var cls = 'fchip', st = '';
      if((s.writes||[]).indexOf(b.id)>-1){ cls += ' write'; st = 'ขั้นนี้อัปเดต'; }
      else if(s.reads.indexOf(b.id)>-1){ cls += ' read'; st = 'ขั้นนี้อ่าน'; }
      if(state.file===b.id) cls += ' sel';
      return '<button type="button" class="'+cls+'" data-file="'+b.id+'" aria-expanded="'+(state.file===b.id)+'" aria-controls="fpanel">'+
        '<span class="fn">'+b.n+'</span><b>'+b.title+'</b><span class="fn">'+b.file+'</span>'+(st?'<span class="st">'+st+'</span>':'')+'</button>';
    }).join('');
}

/* ---------- workflow tabs + header ---------- */
function renderTabs(){
  elTabs.innerHTML = visible().map(function(f){
    return '<button type="button" class="tab" data-flow="'+f.id+'" aria-pressed="'+(f.id===state.flow)+'"><span class="k">'+f.id+'</span>'+f.short+'</button>';
  }).join('') +
  '<button type="button" class="tab more" data-more="1" aria-expanded="'+state.more+'">'+(state.more?'ซ่อน Workflow เพิ่มเติม':'Workflow เพิ่มเติม (C, D, E)')+'</button>';
}
function renderFhead(){
  var f = flow();
  elFhead.innerHTML = '<h2>'+f.title+'</h2><p class="h2-sub">'+f.desc+'</p>'+
    '<div class="d-row"><span class="corner">'+f.corner+'</span></div>'+
    (f.loop ? '<div class="inreply loopnote">'+f.loop+'</div>' : '');
}

/* ---------- swimlane: Human / AI / Tools ---------- */
function renderSwim(){
  var f = flow(), n = f.steps.length, h = '';
  LANES.forEach(function(L,k){
    h += '<div class="band b-'+L.id+'" style="grid-row:'+(k+1)+'"></div>'+
         '<div class="lbl l-'+L.id+'" style="grid-row:'+(k+1)+'"><b>'+L.th+'</b><span>'+L.en+'</span></div>';
  });
  f.steps.forEach(function(s,i){
    var k = laneIdx(s.lane), cls = 'node '+s.lane+(i===state.step?' cur':(i<state.step?' done':''));
    if(state.fromB && f.id==='A' && i===1 && state.step!==1) cls += ' hand';
    h += '<button type="button" class="'+cls+'" id="n-'+i+'" data-node="'+f.id+':'+i+'" style="grid-row:'+(k+1)+';grid-column:'+(i+2)+'"'+(i===state.step?' aria-current="step"':'')+'>'+
      '<span class="lt">'+LANES[k].th+' · '+LANES[k].en+'</span><span class="nn">'+f.id+(i+1)+'</span><span class="nt">'+s.t+'</span></button>';
  });
  h += '<svg class="arrows" id="arrows" aria-hidden="true"></svg>';
  elSwim.style.setProperty('--n', n);
  elSwim.innerHTML = h;
}

/* ---------- arrows between consecutive steps ---------- */
function box(el){
  var d = elSwim.getBoundingClientRect(), r = el.getBoundingClientRect();
  return { x:r.left-d.left, r:r.right-d.left, cy:r.top-d.top+r.height/2 };
}
function drawArrows(){
  var svg = root.getElementById('arrows'); if(!svg || !elSwim.offsetWidth) return;
  if(getComputedStyle(svg).display==='none') return;
  var W = elSwim.offsetWidth, H = elSwim.offsetHeight, f = flow(), base = [], on = [];
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width',W); svg.setAttribute('height',H);
  for(var i=1;i<f.steps.length;i++){
    var a = box(root.getElementById('n-'+(i-1))), c = box(root.getElementById('n-'+i)), lit = i<=state.step;
    var x1 = a.r, y1 = a.cy, x2 = c.x-4, y2 = c.cy, mx = (x1+x2)/2;
    var d = Math.abs(y1-y2)<1.5 ? 'M'+x1+','+y1+' H'+x2 : 'M'+x1+','+y1+' H'+mx+' V'+y2+' H'+x2;
    (lit?on:base).push('<path class="'+(lit?'on':'')+'" d="'+d+'" marker-end="url(#m-'+(lit?'on':'off')+')"/>');
  }
  var mk = function(id){ return '<marker id="m-'+id+'" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk '+id+'" d="M0,1 L9,5 L0,9 z"/></marker>'; };
  svg.innerHTML = '<defs>'+mk('off')+mk('on')+'</defs>'+base.join('')+on.join('');
}

/* ---------- sticky step bar ---------- */
function renderBar(){
  var f = flow();
  elBar.innerHTML = '<span class="sb-flow">Workflow '+f.id+'</span><span class="sb-sep" aria-hidden="true"></span>'+
    f.steps.map(function(s,i){
      return '<button type="button" class="sb-b step '+s.lane+(i===state.step?' on':'')+'" data-node="'+f.id+':'+i+'" title="'+esc(s.t)+'"'+(i===state.step?' aria-current="step"':'')+'>'+f.id+(i+1)+'</button>';
    }).join('');
  var on = elBar.querySelector('.step.on'); if(on) elBar.scrollLeft = Math.max(0, on.offsetLeft - 120);
}

/* ---------- file panel: opens right under the chip row ---------- */
function renderFpanel(){
  if(!state.file){ elFpanel.hidden = true; elFpanel.innerHTML = ''; return; }

    '<button type="button" class="fp-close" data-act="close">ปิด</button></div>'+

    '<div class="d-col"><div class="blk"><h4>หน้าตาไฟล์ (ตัวอย่าง)</h4><div class="out">'+b.preview+'</div></div></div></div>';
}

/* ---------- appendix: every workflow, both loops ---------- */
function renderApp(){
  root.getElementById('appbrain').innerHTML = BRAIN.map(function(b){
    return '<div class="achip" id="ab-'+b.id+'"><span class="fn">'+b.n+'</span><b>'+b.title+'</b><span class="fn">'+b.file+'</span></div>';
  }).join('');
  root.getElementById('approws').innerHTML = FLOWS.map(function(f){
    return '<div class="arow" id="ar-'+f.id+'"><div class="alab"><span class="k">'+f.id+'</span><span>'+f.short+'</span></div><div class="asteps">'+
      f.steps.map(function(s,i){
        var bd = s.writes ? '<span class="bd">อัปเดต '+fileName(s.writes[0])+'</span>' : (s.jump ? '<span class="bd">ส่งต่อไป A2</span>' : '');
        return '<button type="button" class="an '+s.lane+(f.id===state.flow&&i===state.step?' cur':'')+'" id="an-'+f.id+i+'" data-node="'+f.id+':'+i+'">'+
          '<span class="nn">'+f.id+(i+1)+'</span><span class="nt">'+s.t+'</span>'+bd+'</button>';
      }).join('')+'</div></div>';
  }).join('');
}
function drawLoops(){
  var svg = root.getElementById('apploops'), wrap = root.getElementById('appwrap');
  if(!svg || !wrap.offsetWidth || getComputedStyle(svg).display==='none') return;
  var W = wrap.offsetWidth, H = wrap.offsetHeight;
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('width',W); svg.setAttribute('height',H);
  function bx(id){ var d = wrap.getBoundingClientRect(), r = root.getElementById(id).getBoundingClientRect();
    return { x:r.left-d.left, y:r.top-d.top, r:r.right-d.left, b:r.bottom-d.top, cx:r.left-d.left+r.width/2, cy:r.top-d.top+r.height/2 }; }
  var b7 = bx('an-B6'), a2 = bx('an-A1'), rowB = bx('ar-B'), d3 = bx('an-D2'), e3 = bx('an-E2'), v = bx('ab-video'), p = bx('ab-pulse');
  var ym = rowB.y - 15, yE = v.b + 12, yD = v.b + 28;
  var paths = [
    'M'+b7.cx+','+b7.y+' V'+ym+' H'+a2.cx+' V'+(a2.b+4),
    'M'+d3.r+','+d3.cy+' H'+(W-30)+' V'+yD+' H'+v.cx+' V'+(v.b+4),
    'M'+e3.r+','+e3.cy+' H'+(W-14)+' V'+yE+' H'+p.cx+' V'+(p.b+4)
  ];
  svg.innerHTML = '<defs><marker id="m-lp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="mk" d="M0,1 L9,5 L0,9 z" style="stroke:none;stroke-dasharray:none"/></marker></defs>'+
    paths.map(function(d){ return '<path d="'+d+'" marker-end="url(#m-lp)"/>'; }).join('');
}

/* ---------- detail ---------- */
function renderDetail(){
  var f = flow(), s = cur(), i = state.step, n = f.steps.length, L = LANES[laneIdx(s.lane)];
  var reads = s.reads.map(function(r){return '<span class="chip">'+fileName(r)+'</span>';}).join('');
  var writes = (s.writes||[]).map(function(r){return '<span class="chip w">เขียนทับ '+fileName(r)+'</span>';}).join('');
  var tools = s.tools.map(function(t){return '<span class="chip tl">'+toolName(t)+'</span>';}).join('');
  var ptxt = s[state.lang] || s.th;
  var head = '<div class="d-top"><div><div class="d-eyebrow">Workflow '+f.id+' · ขั้นที่ '+(i+1)+'/'+n+' · <span class="lane-badge '+s.lane+'">'+L.th+' · '+L.en+'</span></div><h3 class="d-title">'+s.t+'</h3></div>'+
    '<div class="nav"><button type="button" data-act="prev"'+(i===0?' disabled':'')+'>← ก่อนหน้า</button><button type="button" class="pri" data-act="next"'+(i===n-1?' disabled':'')+'>ถัดไป →</button></div></div>';
  var Lc = '', R = '';
  if(state.fromB && f.id==='A' && i===1) Lc += '<div class="inreply">brief นี้ส่งต่อมาจาก Workflow B ขั้นที่ 7 · สินค้าใหม่ใช้ engine เดียวกันได้ทันที</div>';
  Lc += (reads||writes||tools) ? '<div class="d-row">'+(reads?'อ่าน '+reads:'')+(writes?' '+writes:'')+(tools?' <span style="margin-left:6px">ใช้</span> '+tools:'')+'</div>' : '<div class="d-row">ขั้นนี้ไม่ต้องใช้เครื่องมือ คุณเป็นคนตัดสินใจเอง</div>';
  if(s.input) Lc += '<div class="blk"><h4>'+(s.human?'สิ่งที่ต้องทำ':'Input')+'</h4><p class="inp">'+s.input+'</p></div>';
  if(s.qs) Lc += '<div class="blk"><h4>คำถามที่ต้องถาม</h4><div class="out">'+s.out+'</div></div>';
  if(ptxt){
    var po = state.showPrompt;
    Lc += '<div class="blk"><h4>'+(s.plabel||'Prompt')+'</h4><button type="button" class="ptoggle" data-act="tp" aria-expanded="'+po+'"><span>'+(po?'Hide prompt':'Show prompt')+'</span></button>'+
      (po?'<div class="prompt"><button type="button" class="copy" data-act="copy">คัดลอก</button><div class="ptxt" id="ptxt">'+esc(ptxt)+'</div></div>':'')+'</div>';
  }
  if(s.caveat) Lc += '<div class="caveat">'+s.caveat+'</div>';
  if(!s.qs && s.out) R += '<div class="blk"><h4>'+(s.writes?'สิ่งที่ Claude เสนอ รอคุณอนุมัติ':'ผลลัพธ์ตัวอย่าง')+'</h4><div class="out">'+s.out+'</div></div>';
  if(s.why) R += '<div class="why">'+s.why+'</div>';
  if(s.jump) R += '<button type="button" class="jump" data-act="jump">ส่ง creative brief เข้า Workflow A →</button>';
  elDetail.innerHTML = head + '<div class="d-grid"><div class="d-col">'+Lc+'</div><div class="d-col">'+R+'</div></div>';
}

function render(){
  renderBrain(); renderFpanel(); renderTabs(); renderFhead(); renderSwim(); renderDetail(); renderBar(); renderApp(); drawArrows(); drawLoops();
}

/* ---------- events ---------- */
function go(delta){ var j = state.step + delta; if(j<0||j>=flow().steps.length) return; state.step = j; render(); }
function scrollToMap(){
  var hd = (document.querySelector('header.top').offsetHeight + elBar.offsetHeight), r = root.getElementById('swimwrap').getBoundingClientRect(), lim = hd + 10;
  if(r.top < lim - 4 || r.top > window.innerHeight * 0.45){
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: window.scrollY + r.top - lim, behavior: calm ? 'auto' : 'smooth' });
  }
}
root.addEventListener('click', function(e){
  var t = e.target.closest('[data-file],[data-node],[data-flow],[data-more],[data-act]'); if(!t) return;
  if(t.dataset.file){ state.file = state.file===t.dataset.file ? null : t.dataset.file; render(); return; }
  if(t.dataset.flow){ state.flow = t.dataset.flow; state.step = 0; state.fromB = false; render(); return; }
  if(t.dataset.more){ state.more = !state.more; if(!state.more && MAIN.indexOf(state.flow)<0){ state.flow='A'; state.step=0; } render(); return; }
  if(t.dataset.node){ var p = t.dataset.node.split(':'); if(p[0]!=='A') state.fromB=false; state.flow = p[0]; state.step = +p[1]; if(MAIN.indexOf(p[0])<0) state.more = true; render(); scrollToMap(); return; }
  var a = t.dataset.act;
  if(a==='prev') go(-1);
  if(a==='next') go(1);
  if(a==='close'){ state.file = null; render(); }
  if(a==='tp'){ state.showPrompt = !state.showPrompt; renderDetail(); var tb = elDetail.querySelector('[data-act="tp"]'); if(tb) tb.focus(); }
  if(a==='jump'){ state.flow='A'; state.step=1; state.fromB=true; render(); scrollToMap(); }
  if(a==='copy'){
    var txt = root.getElementById('ptxt').textContent;
    var done = function(){ t.textContent='คัดลอกแล้ว'; t.classList.add('ok'); setTimeout(function(){t.textContent='คัดลอก'; t.classList.remove('ok');},1400); };
    try{ navigator.clipboard.writeText(txt).then(done, selectText); }catch(err){ selectText(); }
  }
});
function selectText(){ var r=document.createRange(); r.selectNodeContents(root.getElementById('ptxt')); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); }
function onKey(e){
  if(!root.host.isConnected){ destroy(); return; }
  if(e.target.matches && e.target.matches('input,textarea')) return;
  if(e.key==='ArrowRight'){ go(1); e.preventDefault(); }
  if(e.key==='ArrowLeft'){ go(-1); e.preventDefault(); }
}
function onResize(){ drawArrows(); drawLoops(); }
document.addEventListener('keydown', onKey);
var ros = [];
if(window.ResizeObserver){
  var r1 = new ResizeObserver(function(){ drawArrows(); }); r1.observe(elSwim);
  var r2 = new ResizeObserver(function(){ drawLoops(); }); r2.observe(root.getElementById('appwrap'));
  ros = [r1, r2];
} else window.addEventListener('resize', onResize);
function destroy(){
  document.removeEventListener('keydown', onKey);
  window.removeEventListener('resize', onResize);
  ros.forEach(function(r){ r.disconnect(); });
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(onResize);

render();
return { setLang:function(l){ state.lang = l; render(); }, destroy:destroy };
}

/* ---------- copy helper ---------- */
function copyText(btn, text, selectEl){
  const ok = () => { btn.textContent = "คัดลอกแล้ว"; btn.classList.add("ok");
    setTimeout(()=>{ btn.textContent = btn.dataset.label || "คัดลอก"; btn.classList.remove("ok"); }, 1600); };
  const fallback = () => { const r = document.createRange(); r.selectNodeContents(selectEl);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); btn.textContent = "กด Ctrl/⌘+C"; };
  try { navigator.clipboard.writeText(text).then(ok, fallback); } catch(e){ fallback(); }
}

/* ---------- language toggle: re-renders the case page (open prompts stay open) ---------- */
function syncSeg(){
  document.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}
function setLang(l){
  lang = l; store.set("wh-lang", l); syncSeg();
  const c = current();
  if (!c) return;
  if (c.type === "engine") { if (engine) engine.setLang(l); return; }
  const y = window.scrollY; renderCase(c); window.scrollTo(0, y);
}
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

/* ---------- router (bare #tokens only; old ids resolve through ROUTE_ALIAS) ---------- */
function current(){
  const raw = location.hash.slice(1), id = ROUTE_ALIAS[raw] || raw;
  if (ROUTE_ALIAS[raw]) history.replaceState(null, "", "#" + id);
  return CASES.find(c => c.id === id);
}
function motion(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches || !("IntersectionObserver" in window)) return;
  const items = [...app.querySelectorAll(":scope > .pill, :scope > h1, :scope > .lede")].map((e, i) => [e, i * 90]);
  app.querySelectorAll(".tier-band, .ex").forEach((e, i) => items.push([e, e.matches(".ex") ? (i % 3) * 60 : 0]));
  const show = e => {
    io.unobserve(e);
    e.classList.add("in");
  };
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) show(en.target); }), { threshold:.15 });
  items.forEach(([e, d]) => { e.classList.add("rv"); e.style.setProperty("--d", d + "ms"); io.observe(e); });
  // a fast fling can jump past an element without IntersectionObserver ever reporting it, so reveal anything at or above the viewport bottom
  let raf = 0;
  const sweep = () => { raf = 0; app.querySelectorAll(".rv:not(.in)").forEach(e => { if (e.getBoundingClientRect().top < innerHeight) show(e); }); };
  addEventListener("scroll", () => { raf = raf || requestAnimationFrame(sweep); }, { passive:true });
}
function route(){
  const c = current();
  if (engine) { engine.destroy(); engine = null; }
  if (stepObs) { stepObs.unscroll && stepObs.unscroll(); stepObs.disconnect(); stepObs = null; }
  c ? renderCase(c) : (renderHub(), motion());
  syncSeg();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
